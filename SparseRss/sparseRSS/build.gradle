buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

apply plugin: 'com.android.application'

repositories {
    google()
    maven {
        url 'https://maven.google.com'
    }
    maven {
        url 'https://repo1.maven.org/maven2/'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.4.20')
    implementation 'org.jsoup:jsoup:1.23.2'

    implementation 'com.github.bumptech.glide:glide:3.7.0'  // 4.8.0' //3.7.0'
    //annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'

    implementation 'net.dankito.readability4j:readability4j:1.0.8'

    def okhttp_version = '5.5.0'
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"

}

android {
    compileSdk 37

    defaultConfig {
        applicationId "de.bernd.shandschuh.sparserss"
        minSdk 23
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    lint {
        disable 'MissingTranslation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'de.bernd.shandschuh.sparserss'
}

