buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.datadoghq:dd-sdk-android-gradle-plugin:1.31.0'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.datadoghq.dd-sdk-android-gradle-plugin'

repositories {
    google()
    maven {
        url 'https://maven.google.com'
    }
    maven {
        url 'https://repo1.maven.org/maven2/'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.19.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.4.20')
    implementation 'org.jsoup:jsoup:1.23.2'

    implementation 'com.github.bumptech.glide:glide:5.0.9'

    implementation 'net.dankito.readability4j:readability4j:1.0.8'

    def okhttp_version = '5.5.0'
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'

    def datadog_version = '3.15.0'
    implementation "com.datadoghq:dd-sdk-android-rum:$datadog_version"
    implementation "com.datadoghq:dd-sdk-android-okhttp:$datadog_version"
    implementation "com.datadoghq:dd-sdk-android-session-replay:$datadog_version"
    implementation "com.datadoghq:dd-sdk-android-session-replay-material:$datadog_version"

}

android {
    compileSdk 37

    defaultConfig {
        applicationId "de.bernd.shandschuh.sparserss"
        minSdk 23
        targetSdk 36
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('localRelease')) {
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        disable 'MissingTranslation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'de.bernd.shandschuh.sparserss'
}


datadog {
    site = 'US1'
}

// Upload the R8 mapping when an API key is available so crash stack traces are readable
afterEvaluate {
    if (System.getenv('DD_API_KEY') || System.getenv('DATADOG_API_KEY')) {
        tasks.named('minifyReleaseWithR8') { finalizedBy tasks.named('uploadMappingRelease') }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Xmaxwarns' << '1000'
}
